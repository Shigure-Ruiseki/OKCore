name: Build, Test and Smart Auto Tag

on:
  pull_request:
    branches: [ master, main ]
    types: [ closed ]

jobs:
  build-and-test:
    if: github.event.pull_request.merged == true
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  create-tag:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Smart Tag via Bash
        run: |
          # 1. Get the latest tag. If no tags exist, default to 1.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "Current latest tag: $LATEST_TAG"

          # 2. Parse the latest tag into MAJOR.MINOR.PATCH variables
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

          # 3. Get current date and tag date using native UTC time (-u)
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$LATEST_TAG" = "1.0.0" ]; then
            # If it's a fresh repo, look back 1 day in UTC to trigger new day logic
            TAG_DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          else
            # Get strict ISO 8601 commit time from Git
            TAG_COMMIT_TIME=$(git log -1 --format=%ai "$LATEST_TAG")
            # Parse the Git time into native UTC date
            TAG_DATE=$(date -u -d "$TAG_COMMIT_TIME" +%Y-%m-%d)
          fi

          echo "Today's date (UTC): $TODAY"
          echo "Latest tag date (UTC): $TAG_DATE"

          # 4. Calculate new version numbers based on date matching
          if [ "$TODAY" = "$TAG_DATE" ]; then
            echo "-> Subsequent merge today: Incrementing PATCH version"
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
          else
            echo "-> First merge of a new day: Incrementing MINOR version, resetting PATCH"
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
          fi

          # 5. Guard condition: If MINOR version >= 6, upgrade to next MAJOR version
          if [ "$NEW_MINOR" -ge 7 ]; then
            echo "-> MINOR version ($NEW_MINOR) >= 7! Upgrading to MAJOR version, resetting MINOR and PATCH."
            NEW_MAJOR=$((NEW_MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
          fi

          NEW_TAG="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "=> New tag to be created: $NEW_TAG"

          # 6. Push the generated tag to Remote Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG
