name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  release-tags:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/release-tags.yml@master
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  jitpack-build:
    runs-on: ubuntu-latest
    needs: release-tags
    steps:
      - name: Trigger JitPack
        run: |
          curl -s https://jitpack.io/api/builds/github/${{ github.repository }}/${{ github.ref_name }}
          echo "JitPack build triggered for ${{ github.repository }} at tag ${{ github.ref_name }}"
